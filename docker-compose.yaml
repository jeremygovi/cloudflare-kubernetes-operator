version: "3.8"

services:
  cloudflare-operator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-kubernetes-operator:latest
    container_name: cloudflare-operator
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Mount kubeconfig for local development
      - ~/.kube/config:/home/operator/.kube/config:ro
    # Use host network to access kind cluster
    network_mode: "host"
