apiVersion: cloudflare.io/v1
kind: CloudflareRuleset
metadata:
  name: rewrite-rules-test
  namespace: default
spec:
  zoneId: "2b47528563f073167e2e466aa26f2ecf"
  name: "TEST Rewrite Rules"
  description: "URL rewrites for API versioning"
  phase: "http_request_transform"
  rules:
    - action: "rewrite"
      expression: "(starts_with(http.request.uri.path, \"/api/v1/\"))"
      description: "Rewrite API v1 to v2"
      enabled: true
      actionParameters:
        uri:
          path:
            expression: "concat(\"/api/v2\", substring(http.request.uri.path, 7))"
