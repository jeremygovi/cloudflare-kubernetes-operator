apiVersion: cloudflare.example.com/v1
kind: CloudflareRuleset
metadata:
  name: security-rules
  namespace: default
spec:
  zoneId: "abcd1234"
  name: "Security Rules"
  description: "Block malicious traffic and suspicious requests"
  phase: "http_request_firewall_custom"
  rules:
    - action: "block"
      expression: "(cf.threat_score gt 50)"
      description: "Block high threat score requests"
      enabled: true
    
    - action: "challenge"
      expression: "(http.request.uri.path contains \"/admin\")"
      description: "Challenge admin panel access"
      enabled: true
    
    - action: "js_challenge"
      expression: "(cf.bot_management.score lt 30)"
      description: "JS challenge for low bot scores"
      enabled: true
