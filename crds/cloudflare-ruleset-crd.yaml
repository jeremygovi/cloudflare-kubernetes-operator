apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudflare-rulesets.cloudflare.example.com
spec:
  group: cloudflare.example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - zoneId
                - phase
                - rules
              properties:
                zoneId:
                  type: string
                  description: "Cloudflare Zone ID"
                name:
                  type: string
                  description: "Ruleset name"
                description:
                  type: string
                  description: "Ruleset description"
                phase:
                  type: string
                  description: "Phase of the ruleset"
                  enum:
                    - http_request_firewall_custom
                    - http_request_firewall_managed
                    - http_request_transform
                    - http_response_headers_transform
                    - http_request_late_transform
                    - http_request_origin
                    - http_response_compression
                rules:
                  type: array
                  description: "List of rules in the ruleset"
                  items:
                    type: object
                    required:
                      - action
                      - expression
                    properties:
                      action:
                        type: string
                        description: "Action to perform"
                        enum:
                          - block
                          - challenge
                          - js_challenge
                          - managed_challenge
                          - allow
                          - log
                          - skip
                          - rewrite
                          - redirect
                      expression:
                        type: string
                        description: "Firewall rule expression"
                      description:
                        type: string
                        description: "Rule description"
                      enabled:
                        type: boolean
                        description: "Whether the rule is enabled"
                        default: true
                      actionParameters:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: "Parameters for the action"
            status:
              type: object
              properties:
                rulesetId:
                  type: string
                  description: "Cloudflare Ruleset ID"
                state:
                  type: string
                  description: "Current state of the ruleset"
                  enum:
                    - Pending
                    - Active
                    - Error
                message:
                  type: string
                  description: "Status message"
                lastSync:
                  type: string
                  format: date-time
                  description: "Last synchronization time"
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Zone
          type: string
          jsonPath: .spec.zoneId
        - name: Phase
          type: string
          jsonPath: .spec.phase
        - name: Rules
          type: integer
          jsonPath: .spec.rules[*]
        - name: State
          type: string
          jsonPath: .status.state
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: cloudflare-rulesets
    singular: cloudflare-ruleset
    kind: CloudflareRuleset
    shortNames:
      - cfrs
      - cfruleset
